<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1416" />
    <title>Дорога в Гузерипль — путеводитель Краснодар → Гузерипль</title>
    <meta
      name="description"
      content="Интерактивный путеводитель по маршруту Краснодар → Гузерипль: 134 места, куда можно подъехать на машине, куда идти пешком и где нужен пропуск Кавказского заповедника."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@200;300;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Восстановление пути после редиректа с 404.html (GitHub Pages, SPA).
      (function () {
        var r = sessionStorage.getItem('spa-redirect')
        if (r) {
          sessionStorage.removeItem('spa-redirect')
          history.replaceState(null, '', r)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
