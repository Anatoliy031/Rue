name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Определить адрес сайта
        id: paths
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "base=/" >> $GITHUB_OUTPUT
            echo "site=https://$REPO" >> $GITHUB_OUTPUT
          else
            echo "base=/$REPO/" >> $GITHUB_OUTPUT
            echo "site=https://$OWNER.github.io/$REPO" >> $GITHUB_OUTPUT
          fi

      - name: Собрать сайт
        env:
          VITE_BASE: ${{ steps.paths.outputs.base }}
          SITE_URL: ${{ steps.paths.outputs.site }}
        run: npm run build

      - name: Подстраховка для маршрутов SPA
        run: cp dist/index.html dist/404-fallback.html || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
